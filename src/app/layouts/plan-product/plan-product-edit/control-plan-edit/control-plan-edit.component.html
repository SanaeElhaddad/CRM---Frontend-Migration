<p-dialog header="{{ title | translate }}" [(visible)]="displayDialog"
 [focusOnShow]="false" [responsive]="true"
  showEffect="fade" [modal]="true"  [style]="{ width: '50vw' }"

  (onHide)='onHideDialog()'>
  <br>




  <div style="height: 50vh;">
    <div class="modal-body">
      <div class="card-body">
        <form [formGroup]="controlPlanForm">
         
          <div class="row  mt-3 justify-content-around">
               <div class="form-group col-md-6 ">
              <label class="font-weight-bold ">{{'Processus' | translate}} *</label>
              <span *ngIf="(controlPlanForm.get('fProcess').touched && controlPlanForm.get('fProcess').invalid) ||
              (isFormSubmitted && controlPlanForm.get('fProcess').invalid)" class="text-lighter"
          style="color: red; font-size: xx-small;">
          Obligatoire
        </span>
              <br />
              <p-dropdown [autoDisplayFirst]="this.editMode" [options]="processList"
               optionLabel="code"
                [filter]="true" [showClear]="true" (onChange)="onSelectProcess($event)"
                formControlName="fProcess"  appendTo="body"></p-dropdown>
            </div>
            <div class="form-group col-md-6 ">
               <label class="font-weight-bold ">{{'Fréquence Type' | translate}} *</label>
              <span *ngIf="(controlPlanForm.get('fFrequencyType').touched && controlPlanForm.get('fFrequencyType').invalid) ||
              (isFormSubmitted && controlPlanForm.get('fFrequencyType').invalid)" class="text-lighter"
          style="color: red; font-size: xx-small;">
          Obligatoire
          </span>
              <br />
              <p-dropdown [autoDisplayFirst]="this.editMode" [options]="frequencyTypeList" 
              [filter]="true" [showClear]="true" (onChange)="onSelectFrequencyType($event)"
              formControlName="fFrequencyType"  appendTo="body" optionLabel="code"></p-dropdown> 

         
            </div>
          
         


          
          
          </div>
          
          
           <div class="row  mt-3 justify-content-around">
            
            <div class="form-group col-md-6 " *ngIf="this.frequenceTypeId===2">
              <label class="font-weight-bold ">{{'Tous ' | translate}} * (En Minute)</label>
              <br />
              <input type="text" class="form-control" pInputText formControlName="fFrequencyTypeValue" />
            </div>
            <div class="form-group col-md-6 ">
             </div>
          
          
          </div> 
          


          
        </form>

<div class="card m-1 ">
  <div class="card-header" style="background-color: #f7f7f7;">
   <div class="row">

    <div class="col-xs-4 col-md-4 pull-left">
      <button

        type="button"
        class="btn btn-sm btn-primary mx-1"
        (click)="onShowDialogControl(selectControl,false)"
        ><!--ADD-->
        <i class="fa fa-plus"></i>
      </button>
    </div>
    <div class=" col-xs-4 col-md-6 pull-center">
      <span style="font-size: 16px; color: #5f5b5b;">
        <b> {{ "Liste des Controles" | translate }}</b></span>
    </div>
  </div></div>
  <div class="card-body border-top-primary">
    <p-table
    [value]="this.selectControlPlan?.controls"  [rows]="5" [paginator]="true"
    [totalRecords]="this.selectControlPlan?.controls.length">
      <ng-template pTemplate="header">
        <tr>
          <th>{{ "Type Controle" | translate }}</th>
         

          <th style="width: 20%;">{{ "Actions" | translate }}</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-line>
        <tr>
          <td>{{line?.controleType?.code}}</td>
        
          <td>
            <button

            type="button"
            class="btn btn-sm btn-primary mx-1"
            (click)="onShowDialogControl(line,true)"
            ><!--ADD-->
            <i class="fa fa-pencil"></i>
          </button>
          <button
          type="button"
          class="btn btn-sm btn-danger mx-1"
          (click)="onDeleteControlLine(line.id)"
          ><!--ADD-->
          <i class="fa fa-trash"></i>
        </button>

          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>
</div>

      </div>
    </div>
  </div>


               <!-- button -->
         



  <p-footer>
  
    <div  class="ui-dialog-buttonpane ui-helper-clearfix">

      <button type="button" pButton (click)="onHideDialog()" class="p-button-primary"
        label="{{'Annuler' | translate }}"></button>
      <button type="button" pButton (click)="onSubmit()" class="p-button-success"
        label="{{ 'Valider' | translate }}"></button>
    </div>
  </p-footer>

  
<div *ngIf="showDialogControl == true">
  <app-control-edit
  [selectControl]="selectControl"
  (lineControlEdited)="onLineControlEdited($event)"

  (showDialog)="onHideDialogControl($event)"
  [editMode]="editMode"
    ></app-control-edit>
</div>
</p-dialog>
