<p-panel
  header="{{ 'Filtre statut de l\'action' | translate }}"
  [toggleable]="true"
>
  <div class="p-fluid p-formgrid p-grid">
    <div class="p-field p-col">
      <label class="font-weight-bold">{{ "Code" | translate }}</label
      ><br />
      <p-autoComplete
        [(ngModel)]="codeSearch"
        [suggestions]="codeStatutActionList"
        (completeMethod)="onNameSearch($event)"
        field="code"
      ></p-autoComplete>
    </div>

    <div class="p-field p-col">
      <label class="font-weight-bold">{{ "Description" | translate }}</label
      ><br />
      <input [(ngModel)]="StatutDescSearch" field="code" pInputText />
    </div>
  </div>
  <br />

  <div class="text-center">
    <button type="button" class="btn btn-primary mr-2" (click)="reset()">
      <i class="fa fa-refresh mr-2"></i> {{ "Réinitialiser" | translate }}
    </button>

    <button type="button" class="btn btn-success" (click)="onSearchClicked()">
      <i class="fa fa-search mr-2"></i> {{ "Rechercher" | translate }}
    </button>
  </div>
</p-panel>
<app-data-table
  [className]="className"
  [cols]="cols"
  [objectList]="statusActionList"
  [collectionSize]="collectionSize"
  [size]="size"
  (objectEdited)="onObjectEdited($event)"
  (lazyLoadData)="loadDataLazy($event)"
  [listName]="titleList"
  [viewBtnVisible]="'false'"

  (exportBtnExcelGlobal)="onExportExcel($event)"
  (exportBtnPdf)="onExportPdf($event)"
  (exportBtnExcelVue)="onExportExcel($event)"

  [permissionCreate]="['PRODUCT_CREATE']"
  [permissionDelete]="['PRODUCT_DELETE']"
  [permissionEdit]="['PRODUCT_EDIT']"
></app-data-table>

<div *ngIf="showDialog == true">
  <app-product-edit
    [editMode]="editMode"
    [selectedProduct]="selectProducts[0]"
    (showDialog)="onShowDialog($event)"
  ></app-product-edit>
</div>
