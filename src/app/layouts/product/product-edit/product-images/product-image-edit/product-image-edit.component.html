<p-dialog
  header="{{ title | translate }}"
  [(visible)]="displayDialog"
  [focusOnShow]="false"
  [responsive]="true"
  showEffect="fade"
  [modal]="true"
  [style]="{ width: '600px' }"
  (onHide)="onShowDialog()"
>


<form  [formGroup]="imageProductForm">
  <div class="row">
    <div class="form-group col-md-6">
      <label for="">Code*:</label>
      <input type="text" pInputText formControlName="code" />
     </div>
    <div class="form-group col-md-6">
      <label for="">Description:</label>
      <input type="text" pInputText formControlName="description"/>
    </div>
    <div class="form-group col-md-6">
      <label class="btn btn-primary" for="file-input">+Logo</label>
      <br />
      <input
        type="file"
        id="file-input"
        class="btn btn-primary"
        formControlName="bytes"
        (change)="myUploader($event)"
      />
    </div>
    <div class="form-group col-md-6">
      <img
      class="mt-3 w-10 h-10"
      src="data:image/jpeg;base64,{{logoProduct}}" [alt]="selectedProductImage.id"/>
    </div>
  </div>
  <br><br>
  <div class="text-center">

    <button  type="button" class="button-primary" (click)="annuler()">Annuler</button>


    <button type="button" class="button-success" [disabled]="imageProductForm.invalid" (click)="onSubmitForm()">Valider</button>


  </div>
</form>


</p-dialog>
