<p-dialog
  header="{{ title | translate }}"
  [(visible)]="displayDialog"
  [focusOnShow]="false"
  [responsive]="true"
  showEffect="fade"
  [modal]="true"
  [style]="{ width: '900px' }"
  (onHide)="onShowDialog()"
>
  <div class="mt-3">
    <form [formGroup]="productPriceForm">
      <div class="p-field">
        <label class="font-weight-bold">{{ "Zone*" | translate }}</label
        ><br />
        <p-autoComplete formControlName="zone" [suggestions]="codeZone" (completeMethod)="onCodeSearch($event)" field="zoneCode" [dropdown]="true">
    </p-autoComplete>

      </div>
      <div class="p-field">
        <label class="font-weight-bold">{{ "Prix de vente PARTENAIREN1" | translate }}</label
        ><br />
        <input
          formControlName="wholeSalePrice"
          field="wholeSalePrice"
          pInputText
          name="wholeSalePrice"
        />
      </div>
      <div class="p-field">
        <label class="font-weight-bold">{{ "Prix de vente PARTENAIREN2" | translate }}</label
        ><br />
        <input
          formControlName="retailPrice"
          field="retailPrice"
          pInputText
          name="retailPrice"
        />
      </div>
      <div class="p-field">
        <label class="font-weight-bold">{{ "Prix de vente PARTENAIREN3" | translate }}</label
        ><br />
        <input
          formControlName="semiWholeSalePrice"
          field="semiWholeSalePrice"
          pInputText
          name="semiWholeSalePrice"
        />
      </div>
      <div class="d-flex justify-content-center mt-4">
        <button
          (click)="onShowDialog()"
          type="button"
          class="btn btn-primary mr-2"
        >
          Annuler
        </button>
        <button
          type="button"
          (click)="onSubmitForm()"
          class="btn btn-success"
        >
          Valider
        </button>
      </div>
    </form>
  </div>
</p-dialog>
