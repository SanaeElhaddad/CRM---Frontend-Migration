<p-dialog
  header="{{ title | translate }}"
  [(visible)]="displayDialog"
  [focusOnShow]="false"
  [responsive]="true"
  showEffect="fade"
  [modal]="true"
  [style]="{ width: '900px' }"
  (onHide)="onShowDialog()"
>

  <form [formGroup]="productPackForm">
      <div class="p-fluid p-formgrid p-grid">
        <div class="p-field p-col">
          <label>Pseudo du produit</label>
          <input
            pInputText
            formControlName="alias"
          />
        </div>
        <div class="p-field p-col">
          <label>Unité de mesure*</label>
          <p-autoComplete formControlName="uom" [suggestions]="uom" (completeMethod)="onSearchCode($event)" field="uomCode"
          ></p-autoComplete>
        </div>
        <div class="p-field p-col">
          <label>Quantité en UN*</label>
          <input
            pInputText
            formControlName="quantity"
          />
        </div>
        <div class="p-field p-col">
          <label>Prix de vente*</label>
          <input
            pInputText
            formControlName="salePrice"
          />
        </div>
      </div>
      <div class="d-flex justify-content-center mt-4">
        <button
          (click)="onShowDialog()"
          type="button"
          class="btn btn-primary mr-2"
        >
          Annuler
        </button>
        <button
          type="button"
          (click)="onSubmitForm()"
          class="btn btn-success"
        >
          Valider
        </button>
      </div>
  </form>
</p-dialog>
